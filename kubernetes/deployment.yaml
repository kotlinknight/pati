apiVersion: apps/v1
kind: Deployment
metadata:
  name: pati-backend
  labels:
    app: pati-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pati-backend
  template:
    metadata:
      labels:
        app: pati-backend
    spec:
      containers:
      - name: pati-backend
        image: jithukrishnaju/pati-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres-service:5432/patidb"
        - name: SPRING_DATASOURCE_USERNAME
          value: "postgres"
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-service
              key: postgres-password
        - name: SPRING_REDIS_HOST
          value: "redis-service-master"
        - name: SPRING_REDIS_PORT
          value: "6379"
